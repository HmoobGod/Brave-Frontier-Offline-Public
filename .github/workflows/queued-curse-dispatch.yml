name: Queued Curse action dispatch source check
on:
  pull_request:
    paths:
      - 'prepare_source_aware_auto_v041.py'
      - 'test_bf_queued_curse_dispatch.py'
      - '.github/workflows/queued-curse-dispatch.yml'
jobs:
  queued-curse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 test_bf_queued_curse_dispatch.py --source-only
