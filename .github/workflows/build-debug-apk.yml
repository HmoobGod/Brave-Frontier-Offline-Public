name: Build Offline Android APK
on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

# Prevent outdated feature-branch pushes from consuming parallel CI runners.
# Main and each feature branch keep their own independent run group.
concurrency:
  group: bf-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore persistent debug signing key
        shell: bash
        env:
          BF_DEBUG_KEYSTORE_B64: ${{ secrets.BF_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p .github/debug
          if [[ -z "${BF_DEBUG_KEYSTORE_B64:-}" ]]; then
            echo 'Missing BF_DEBUG_KEYSTORE_B64 Actions repository secret.' >&2
            exit 1
          fi
          printf '%s' "$BF_DEBUG_KEYSTORE_B64" | base64 --decode > .github/debug/bf-development-debug.keystore
          keytool -list -keystore .github/debug/bf-development-debug.keystore -storepass android -alias androiddebugkey > /dev/null
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Python for Chromium regressions
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original sprite atlas renderer
        run: python -m pip install Pillow
      - name: Prepare bundled HTML assets
        run: |
          python3 patch_bf_save_quarantine.py
          python3 prepare_global_mission_expansion.py
          python3 prepare_global_unit_archive.py
          python3 prepare_bf_optional_archived_art_v18800.py
          python3 prepare_bf_historical_battle_illustrations_v18900.py
          python3 prepare_global_unit_codex.py
          python3 prepare_original_bb_targeting.py
