name: Smart Auto support execution recheck source check
on:
  pull_request:
    paths:
      - 'prepare_source_aware_auto_v041.py'
      - 'app/src/main/assets/bf10500_qol_advanced_smart_auto.js'
      - 'app/src/main/assets/bf8800_live_normal_crystal_events.js'
      - 'app/src/main/assets/bf9300_single_hit_critical_combat.js'
      - 'app/src/main/assets/bf9500_multihit_critical_combat.js'
      - 'test_bf_auto_support_recheck.py'
      - 'test_bf_packaged_source_aware_auto_v041.py'
      - 'AUTO_SUPPORT_RECHECK.md'
      - '.github/workflows/auto-support-recheck.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auto-support-recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 test_bf_auto_support_recheck.py --source-only
