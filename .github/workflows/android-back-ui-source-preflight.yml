name: Android Back and in-page engine UI source preflight
on:
  pull_request:
    paths:
      - '.github/workflows/android-back-ui-source-preflight.yml'
      - '.github/workflows/build-debug-apk.yml'
      - 'app/src/main/java/org/bravefrontier/offline/MainActivity.java'
      - 'app/src/main/assets/bf_home_nav.js'
      - 'test_bf_android_back_home_v22500.py'
      - 'test_bf_engine_webview_recovery_v22600.py'
      - 'test_bf_renderer_dialog_lifecycle_v23100.py'
      - 'test_bf_offline_page_reload_v23200.py'
      - 'test_bf_stale_webview_finish_guard_v23300.py'
      - 'test_bf_offline_main_navigation_token_v23400.py'
      - 'V235_MAIN_NAVIGATION_FAIL_CLOSED_TEST_FOLLOWUP.md'
      - 'V234_OFFLINE_MAIN_NAVIGATION_TOKEN.md'
      - 'V233_STALE_WEBVIEW_FINISH_GUARD.md'
      - 'V232_OFFLINE_MAIN_RELOAD_STATE.md'
      - 'V231_RENDERER_DIALOG_LIFECYCLE.md'
      - 'test_bf_offline_page_recovery_v22900.py'
      - 'V229_OFFLINE_STARTUP_ERROR_RECOVERY.md'
      - 'V226_WEBVIEW_BACK_RECOVERY.md'
      - 'V225_ANDROID_BACK_ENGINE_UI.md'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-ui-back:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Android Back UI routing without save changes
        run: python3 test_bf_android_back_home_v22500.py --source-only
      - name: Verify lost callbacks, renderer-crash UI, and save-safety boundaries
        run: python3 test_bf_engine_webview_recovery_v22600.py
      - name: Verify renderer recovery dialog is dismissed on Activity destruction
        run: python3 test_bf_renderer_dialog_lifecycle_v23100.py
      - name: Verify offline main-page failure recovery guards
        run: python3 test_bf_offline_page_recovery_v22900.py
      - name: Verify new exact packaged-page load resets a stale error state
        run: python3 test_bf_offline_page_reload_v23200.py
      - name: Verify late finishing callbacks cannot inject into stale WebViews
        run: python3 test_bf_stale_webview_finish_guard_v23300.py
      - name: Verify only explicit native load starts can reset main-page failure
        run: python3 test_bf_offline_main_navigation_token_v23400.py
