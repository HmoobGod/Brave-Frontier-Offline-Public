plugins { id 'com.android.application' }
android {
    namespace 'org.bravefrontier.offline'
    compileSdk 35
    // CI provides a monotonically increasing installable versionCode.
    // Local development builds retain the existing value by default.
    def ciBuildCode = project.findProperty('ciVersionCode')
    defaultConfig {
        applicationId 'org.bravefrontier.offline'
        minSdk 26
        targetSdk 35
        versionCode ciBuildCode ? ciBuildCode.toString().toInteger() : 15
        versionName '110.00.0-demo'
    }
    // Debug-only development identity loaded from a GitHub Actions secret.
    // This must remain the same certificate for existing in-place APK updates;
    // it is NOT a production signing key.
    signingConfigs {
        debug {
            storeFile file("${rootProject.projectDir}/.github/debug/bf-development-debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Keep direct Gradle builds consistent with CI: patch the bundled HTML
// with a tested, idempotent save-recovery fix before processing assets.
tasks.register('prepareDemoAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine System.getProperty('os.name').toLowerCase().contains('windows') ? 'py' : 'python3', 'patch_bf_save_quarantine.py'
}
afterEvaluate { tasks.named('preBuild').configure { dependsOn tasks.named('prepareDemoAssets') } }


